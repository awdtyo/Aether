services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aether:aether@db:5432/aether
      # Private user data (skills approved via discovery, local caches).
      # Mount your host data dir; nothing personal is baked into the image.
      AETHER_DATA_DIR: /data/aether
    ports:
      - "8000:8000"
    volumes:
      - ./skills:/app/skills:ro
      - aether_workspace:/tmp/aether_workspace
      - ${AETHER_DATA_DIR:-${HOME}/.aether}:/data/aether
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  aether_workspace:
